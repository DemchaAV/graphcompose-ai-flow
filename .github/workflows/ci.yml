name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  revision-manager:
    name: revision-manager (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/revision-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tools/revision-manager/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: smoke (init / new-revision / approve / history)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cd "$tmp"
          node "$GITHUB_WORKSPACE/tools/revision-manager/bin/graphcompose-flow.mjs" init demo
          cd demo
          node "$GITHUB_WORKSPACE/tools/revision-manager/bin/graphcompose-flow.mjs" status
          node "$GITHUB_WORKSPACE/tools/revision-manager/bin/graphcompose-flow.mjs" new-revision "first draft"
          node "$GITHUB_WORKSPACE/tools/revision-manager/bin/graphcompose-flow.mjs" approve
          node "$GITHUB_WORKSPACE/tools/revision-manager/bin/graphcompose-flow.mjs" history

  visual-diff:
    name: visual-diff (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/visual-diff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tools/visual-diff/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: smoke (identical fixtures -> IDENTICAL)
        run: |
          set -euo pipefail
          out="$(node bin/visual-diff.mjs fixtures/identical-a.png fixtures/identical-b.png --json)"
          echo "$out"
          echo "$out" | grep -q '"classification": "IDENTICAL"'
          echo "$out" | grep -q '"parityScore": 100'

  preview-renderer:
    name: preview-renderer (Java 21 + Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/preview-renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: mvn -B -q -DskipTests=false test
      - run: mvn -B -q -DskipTests=true package
      - name: smoke (render without GraphCompose classpath)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/revision"
          printf '{"id":"revision-001","status":"DRAFT"}\n' > "$tmp/revision/revision.json"
          touch "$tmp/revision/generated-template.java"
          out="$(java -jar target/preview-renderer.jar render --revision "$tmp/revision" --template-class com.example.Whatever --classpath "" 2>&1)"
          echo "$out"
          echo "$out" | grep -q 'graphcompose runtime not detected on classpath'
      - name: smoke (invoice reference render)
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          node scripts/render-invoice-reference.mjs revision-001
          node scripts/render-invoice-reference.mjs revision-002
          node scripts/render-invoice-reference.mjs revision-003
          node scripts/render-cv-reference.mjs revision-001
          node scripts/render-cv-reference.mjs revision-002

  skill-fixtures:
    name: skill-fixtures (GraphCompose 2.2.0 via Maven Central)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - row-basic
          - section-basic
          - table-basic
          - layer-stack-badge
          - shape-container-card
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - run: mvn -B test
        working-directory: examples/skill-fixtures/${{ matrix.fixture }}

  harness-contracts:
    # The cross-cutting gate: one routing source, schemas and config agreeing,
    # skills that exist and name tools that exist, plugin and Codex packaging
    # matching the skills they ship, and the docs not drifting back to the old
    # agent-chain story. Cheap and first, so an inconsistency does not wait
    # behind four minutes of Maven.
    name: harness contracts (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The end-to-end workspace test drives the revision-manager CLI, which is
      # TypeScript compiled into a gitignored dist/. Without this the CLI does
      # what it is supposed to do on an unbuilt checkout -- exit 69 telling the
      # caller to run setup -- and the test fails on a missing build rather than
      # on anything it means to check.
      - name: build the revision-manager CLI the workspace test drives
        working-directory: tools/revision-manager
        run: npm ci && npm run build
      # render-and-diff drives the visual-diff CLI (scaling + diff), and its
      # test generates PNGs with the same pngjs the tool uses.
      - name: build the visual-diff CLI the loop-pass test drives
        working-directory: tools/visual-diff
        run: npm ci && npm run build
      - name: contract, workspace, loop, plugin and adapter tests
        run: npm test

  repository-contract:
    name: repository contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: run repository-contract checks
        run: node .github/scripts/repository-contract.mjs

  skill-validation-cache:
    name: skill-validation-cache (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/skill-validation-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test

  asset-resolver-cache:
    name: asset-resolver icon cache (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/asset-resolver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm run lint
      - run: npm test

  schema-validation:
    name: JSON Schema validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: .github/scripts/package-lock.json
      - run: npm ci
      - name: validate every on-disk artifact against schemas/
        working-directory: ${{ github.workspace }}
        run: node .github/scripts/validate-schemas.mjs
      - name: the artifact schemas accept and reject what they should
        run: npm test

  validate-skills:
    name: skill validation (render fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: build visual-diff
        working-directory: tools/visual-diff
        run: npm ci && npm run build
      # render-only: PNG baselines are platform-specific, so CI gates on the
      # render path (compile + render to non-empty PDF/PNG), not pixel identity.
      # The strict visual-diff vs baseline is a local developer check.
      - name: render skill fixtures through preview-renderer
        run: node scripts/validate-skills.mjs --render-only
